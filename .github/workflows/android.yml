name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KS_PASS: ${{ secrets.KS_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install packages
        run: npm install
      - name: Create Android project
        run: npx cap add android
      - name: Set app version
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - name: Copy web app into Android
        run: npx cap sync android
      - name: Use fixed signing key (so updates install over old app)
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Build signed release APK
        if: env.KS_PASS != '' && env.KEYSTORE_B64 != ''
        run: |
          cd android && ./gradlew assembleRelease && cd ..
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          "$BT/zipalign" -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-key-alias charcoal --ks-pass env:KS_PASS --key-pass env:KS_PASS --out charcoal-lead-desk-release.apk aligned.apk
          "$BT/apksigner" verify charcoal-lead-desk-release.apk
          rm release.jks
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: charcoal-lead-desk-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload release APK
        if: env.KS_PASS != '' && env.KEYSTORE_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: charcoal-lead-desk-release-apk
          path: charcoal-lead-desk-release.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk charcoal-lead-desk-debug.apk
          FILE=charcoal-lead-desk-debug.apk
          NOTE="Debug APK (personal use)"
          if [ -f charcoal-lead-desk-release.apk ]; then FILE=charcoal-lead-desk-release.apk; NOTE="Signed release APK"; fi
          gh release create "v1.0.${{ github.run_number }}" "$FILE" \
            --title "Charcoal Lead Desk 1.0.${{ github.run_number }}" \
            --notes "$NOTE"
